{% extends "users/base.html" %}

{% block title %}Log in – Docsphere{% endblock %}

{% block content %}
    <h1>Log in</h1>
    <form method="post" action="{% url 'login' %}">
        {% csrf_token %}
        {% if request.GET.next %}
            <input type="hidden" name="next" value="{{ request.GET.next }}">
        {% endif %}
        {{ form.as_p }}
        <button type="submit">Log in</button>
    </form>
{% endblock %}
