{% extends "users/base.html" %}

{% block title %}New document – {{ project.name }} – Docsphere{% endblock %}

{% block content %}
<h1>New document</h1>
<p>Project: <strong>{{ project.name }}</strong></p>
<form method="post" action="{% url 'documents:create_document' project.pk %}">
	{% csrf_token %}
	{{ form.as_p }}
	<button type="submit">Create</button>
</form>
<p>
	<a href="{% url 'documents:list_documents' project.pk %}">Cancel</a>
	|
	<a href="{% url 'projects:project_detail' project.pk %}">Project</a>
</p>
{% endblock %}
