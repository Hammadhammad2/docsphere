{% extends "users/base.html" %}

{% block title %}Edit {{ document.title }} – Docsphere{% endblock %}

{% block content %}
<h1>Edit document</h1>
<p>Project: <strong>{{ project.name }}</strong></p>
<form method="post" action="{% url 'documents:update_document' project.pk document.pk %}">
	{% csrf_token %}
	{{ form.as_p }}
	<button type="submit">Save</button>
</form>
<p>
	<a href="{% url 'documents:document_detail' project.pk document.pk %}">Cancel</a>
	|
	<a href="{% url 'documents:list_documents' project.pk %}">All documents</a>
</p>
{% endblock %}
