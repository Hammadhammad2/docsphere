{% extends "users/base.html" %}

{% block title %}Create project – {{ organization.name }} – Docsphere{% endblock %}

{% block content %}
<h1>Create project</h1>
<p>Organization: <strong>{{ organization.name }}</strong></p>
<form method="post" action="{% url 'projects:create_project' organization.pk %}">
	{% csrf_token %}
	{{ form.as_p }}
	<button type="submit">Create</button>
</form>
<p>
	<a href="{% url 'organizations:organization_detail' organization.pk %}">Back to {{ organization.name }}</a>
	|
	<a href="{% url 'projects:list_projects' %}">All projects</a>
</p>
{% endblock %}
